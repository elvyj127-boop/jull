<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jull Fine Jewellery — The New Heirloom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&family=Pinyon+Script&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="uploads/jull-j-mark-transparent.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "champagne",
  "ground": "taupe",
  "heroLayout": "split",
  "showMarquee": true,
  "headlineStyle": "italic",
  "richBackgrounds": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // apply tweaks via CSS vars on <html>
  React.useEffect(() => {
    const r = document.documentElement;
    if (tweaks.accent === 'wine-deep') {
      r.style.setProperty('--oxblood', '#4B1412');
    } else if (tweaks.accent === 'champagne') {
      r.style.setProperty('--oxblood', '#9C7B3A');
    } else {
      r.style.setProperty('--oxblood', '#711F1B');
    }
    if (tweaks.ground === 'cream') {
      r.style.setProperty('--ivory', '#FFF8EE');
    } else if (tweaks.ground === 'taupe') {
      r.style.setProperty('--ivory', '#EFE6D6');
    } else {
      r.style.setProperty('--ivory', '#F8F3EA');
    }
  }, [tweaks.accent, tweaks.ground]);

  return (
    <>
      <Header />
      <Hero heroVariant={tweaks.heroLayout}/>
      {tweaks.showMarquee && <Marquee />}
      <SignatureStone />
      <DesignBoard />
      <Collections />
      <Icons />
      <Bridal />
      <Gifts />
      <Materials />
      <Journal />
      <Newsletter />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Palette">
          <TweakRadio
            label="Accent"
            value={tweaks.accent}
            onChange={v => setTweak('accent', v)}
            options={[
              { value: 'oxblood', label: 'Oxblood' },
              { value: 'wine-deep', label: 'Wine' },
              { value: 'champagne', label: 'Champagne' },
            ]}
          />
          <TweakRadio
            label="Background"
            value={tweaks.ground}
            onChange={v => setTweak('ground', v)}
            options={[
              { value: 'ivory', label: 'Ivory' },
              { value: 'cream', label: 'Cream' },
              { value: 'taupe', label: 'Taupe' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakToggle
            label="Marquee divider"
            value={tweaks.showMarquee}
            onChange={v => setTweak('showMarquee', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
